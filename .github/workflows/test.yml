name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The interop suite runs the pinned Rivet release (DEFAULT_RIVET_VERSION),
      # downloaded by the product's own ensureRivetBinary into ~/.cache/rivet-ts.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rivet-ts
          key: rivet-${{ runner.os }}-${{ hashFiles('src/config/rivet-binary.ts') }}
      - run: pnpm lint
      - run: pnpm check
      # plumb-dependent legs self-skip when plumb is absent.
      - run: pnpm test
